[project]
name = "daily-downside"
version = "0.1.0"
description = "A daily US stock report that leads with the downside: calibrated weekly ranges, level odds, and dollar stress tests that understand leveraged ETFs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
downside = "downside.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/downside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
